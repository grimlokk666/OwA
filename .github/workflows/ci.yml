name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: pytest

  frontend:
    name: frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          docker compose config --quiet
          docker compose --profile nav config --quiet
          bash -n scripts/nav-download.sh scripts/nav-build.sh scripts/nav-refresh.sh
          ./scripts/nav-download.sh --dry-run
          ./scripts/nav-build.sh --dry-run
          ./scripts/nav-refresh.sh --dry-run
