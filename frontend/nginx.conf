server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: service worker + manifest must never be long-cached incorrectly
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Proxy API to self-hosted backend (same Tailscale host / docker network)
    location /api/ {
        proxy_pass http://overwatch-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://overwatch-backend:8000/health;
    }

    # Self-hosted tiles. The upstream is resolved at request time so this
    # container still starts when the nav profile is not running.
    location /tiles/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tile_upstream overwatch-tiles:8080;
        proxy_pass http://$tile_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host overwatch-tiles;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
